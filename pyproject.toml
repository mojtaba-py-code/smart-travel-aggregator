[project]
name = "smart-travel-aggregator"
version = "1.0.0"
description = "Aggregates flights, hotels, weather, currency and maps behind one clean, resilient REST API."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "redis>=5.0",
    "celery>=5.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "PL", "RUF", "ASYNC", "S"]
ignore = [
    "PLR0913",  # a few constructors/endpoints legitimately take many collaborators
    "PLR0917",  # FastAPI endpoints declare many (keyword) query params by design
    "S101",     # asserts are fine in tests
    "S105",     # false positive: the literal is the "token_type" discriminator, not a secret
    "S106",     # false positive: `token_type` argument name, not a password
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004"]
"alembic/**" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["app/workers/*", "app/main.py", "app/db/migrations_env.py"]
