name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Ruff (format check)
        run: ruff format --check app tests

      - name: Mypy (types)
        run: mypy app

      - name: Pytest (with coverage gate)
        run: pytest

      - name: Bandit (security scan)
        run: |
          pip install bandit
          bandit -q -r app --severity-level medium

      - name: pip-audit (dependency CVEs)
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f docker/Dockerfile -t smart-travel-aggregator:ci .
